name: Feature request
description: Suggest a change to a plugin, or a new plugin.
labels: [enhancement]
body:
  - type: input
    id: plugin
    attributes:
      label: Plugin
      description: Which plugin this is for, or "new plugin".
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
